services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licencias}
      POSTGRES_USER: ${POSTGRES_USER:-licencias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-licencias}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-licencias}?schema=public
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET}
    expose:
      - "3005"

volumes:
  postgres_data:

